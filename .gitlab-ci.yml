include:
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: SAST.gitlab-ci.yml
  - project: 'jfelten.work-group/ez_appsec/ez_appsec'
    ref: main
    file: 'scan.yml'

stages:
  - .pre
  - initialize
  - build
  - test
  - scan
  - deploy
  - .post

variables:
  SAST_EXCLUDED_PATHS: "frontend/src/assets/private/**"